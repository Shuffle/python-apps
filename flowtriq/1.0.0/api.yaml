app_version: 1.0.0
name: Flowtriq
description: DDoS detection and mitigation platform. Query active incidents, monitor node health, and trigger mitigation rules from SOAR playbooks.
contact_info:
  name: "@flowtriq"
  url: https://flowtriq.com
  email: "support@flowtriq.com"
tags:
  - DDoS
  - Network Security
  - Mitigation
categories:
  - Network
authentication:
  required: true
  parameters:
    - name: base_url
      description: The base URL of your Flowtriq instance API (e.g. https://your-instance.flowtriq.com)
      multiline: false
      example: "https://demo.flowtriq.com"
      required: true
      schema:
        type: string
    - name: api_key
      description: Bearer token for API authentication
      multiline: false
      example: "*****"
      required: true
      schema:
        type: string
    - name: verify_ssl
      description: Whether to verify TLS certificates
      multiline: false
      required: false
      options:
        - true
        - false
      example: "true"
      schema:
        type: string
actions:
  - name: list_incidents
    description: List active DDoS incidents with optional filtering by status
    parameters:
      - name: base_url
        description: The base URL of your Flowtriq instance API
        multiline: false
        example: "https://demo.flowtriq.com"
        required: true
        schema:
          type: string
      - name: api_key
        description: Bearer token for API authentication
        multiline: false
        example: "*****"
        required: true
        schema:
          type: string
      - name: verify_ssl
        description: Whether to verify TLS certificates
        multiline: false
        required: false
        options:
          - true
          - false
        example: "true"
        schema:
          type: string
      - name: status
        description: Filter incidents by status (e.g. active, resolved). Leave empty for all.
        multiline: false
        required: false
        example: "active"
        schema:
          type: string
    returns:
      schema:
        type: string
      example: |
        {
          "success": true,
          "incidents": [
            {
              "id": "inc-001",
              "attack_type": "volumetric",
              "target": "203.0.113.50",
              "volume_bps": 12000000000,
              "source_ips": ["198.51.100.1", "198.51.100.2"],
              "status": "active",
              "started_at": "2026-06-28T14:30:00Z"
            }
          ]
        }
  - name: get_incident
    description: Get detailed information about a specific incident including attack type, source IPs, target, and volume
    parameters:
      - name: base_url
        description: The base URL of your Flowtriq instance API
        multiline: false
        example: "https://demo.flowtriq.com"
        required: true
        schema:
          type: string
      - name: api_key
        description: Bearer token for API authentication
        multiline: false
        example: "*****"
        required: true
        schema:
          type: string
      - name: verify_ssl
        description: Whether to verify TLS certificates
        multiline: false
        required: false
        options:
          - true
          - false
        example: "true"
        schema:
          type: string
      - name: incident_id
        description: The ID of the incident to retrieve
        multiline: false
        example: "inc-001"
        required: true
        schema:
          type: string
    returns:
      schema:
        type: string
      example: |
        {
          "success": true,
          "incident": {
            "id": "inc-001",
            "attack_type": "volumetric",
            "target": "203.0.113.50",
            "volume_bps": 12000000000,
            "volume_pps": 8500000,
            "source_ips": ["198.51.100.1", "198.51.100.2"],
            "status": "active",
            "started_at": "2026-06-28T14:30:00Z",
            "node_id": "node-us-east-1"
          }
        }
  - name: list_nodes
    description: List all monitored nodes and their current status
    parameters:
      - name: base_url
        description: The base URL of your Flowtriq instance API
        multiline: false
        example: "https://demo.flowtriq.com"
        required: true
        schema:
          type: string
      - name: api_key
        description: Bearer token for API authentication
        multiline: false
        example: "*****"
        required: true
        schema:
          type: string
      - name: verify_ssl
        description: Whether to verify TLS certificates
        multiline: false
        required: false
        options:
          - true
          - false
        example: "true"
        schema:
          type: string
    returns:
      schema:
        type: string
      example: |
        {
          "success": true,
          "nodes": [
            {
              "id": "node-us-east-1",
              "name": "US East",
              "status": "online",
              "last_seen": "2026-06-28T15:00:00Z"
            }
          ]
        }
  - name: create_mitigation_rule
    description: Create a mitigation rule to block or rate-limit attack traffic. Used in SOAR playbooks to enable scrubbing when a DDoS is detected.
    parameters:
      - name: base_url
        description: The base URL of your Flowtriq instance API
        multiline: false
        example: "https://demo.flowtriq.com"
        required: true
        schema:
          type: string
      - name: api_key
        description: Bearer token for API authentication
        multiline: false
        example: "*****"
        required: true
        schema:
          type: string
      - name: verify_ssl
        description: Whether to verify TLS certificates
        multiline: false
        required: false
        options:
          - true
          - false
        example: "true"
        schema:
          type: string
      - name: name
        description: A descriptive name for the mitigation rule
        multiline: false
        example: "Block volumetric attack on 203.0.113.50"
        required: true
        schema:
          type: string
      - name: rule_type
        description: The type of mitigation rule
        multiline: false
        required: true
        options:
          - block
          - rate_limit
          - scrub
        example: "block"
        schema:
          type: string
      - name: target
        description: The target IP or prefix to protect
        multiline: false
        example: "203.0.113.50"
        required: true
        schema:
          type: string
      - name: source_ips
        description: Comma-separated list of source IPs or prefixes to match against. Leave empty to match all sources.
        multiline: true
        required: false
        example: "198.51.100.1,198.51.100.2"
        schema:
          type: string
      - name: duration_minutes
        description: How long the rule should remain active, in minutes. Leave empty for indefinite.
        multiline: false
        required: false
        example: "60"
        schema:
          type: string
    returns:
      schema:
        type: string
      example: |
        {
          "success": true,
          "rule": {
            "id": "rule-abc123",
            "name": "Block volumetric attack on 203.0.113.50",
            "rule_type": "block",
            "target": "203.0.113.50",
            "status": "active",
            "created_at": "2026-06-28T15:05:00Z"
          }
        }
