app_version: 1.0.0
name: mlab
description: "mlab.sh: domain / IP / crypto / file / hash / URL / email / phone / MAC scanning, IOC extraction, CVE intelligence and threat-actor data."
contact_info:
  name: "mlab.sh"
  url: https://mlab.sh
  email: support@mlab.sh
tags:
  - Intel
  - Scanner
  - CVE
categories:
  - Intel
authentication:
  required: true
  parameters:
    - name: apikey
      description: "mlab.sh API key (starts with mlab_). Account → Settings → API Keys. CVE and threat-actor actions don't use it."
      example: "mlab_..."
      required: true
      schema:
        type: string
    - name: url
      description: "Core API base URL. Only change for self-hosted instances."
      example: "https://mlab.sh/api/v1"
      required: false
      schema:
        type: string
actions:
  - name: scan_domain
    description: "Launch a domain scan; optionally wait and return full results (subdomains, DNS, SSL, security.txt)"
    parameters:
      - name: domain
        description: "Domain to scan"
        required: true
        multiline: false
        example: "example.com"
        schema:
          type: string
      - name: wait_for_completion
        description: "Poll until the scan finishes and return results"
        required: false
        multiline: false
        example: "true"
        schema:
          type: string
        options:
          - "true"
          - "false"
      - name: timeout
        description: "Max seconds to wait"
        required: false
        multiline: false
        example: "120"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_domain_status
    description: "Status of a domain scan"
    parameters:
      - name: domain
        description: "Domain"
        required: true
        multiline: false
        example: "example.com"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_domain_results
    description: "Results of a finished domain scan"
    parameters:
      - name: domain
        description: "Domain"
        required: true
        multiline: false
        example: "example.com"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_domain_ssl
    description: "SSL certificates seen for a domain"
    parameters:
      - name: domain
        description: "Domain"
        required: true
        multiline: false
        example: "example.com"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: capture_network_requests
    description: "Load a page and capture every network request it makes"
    parameters:
      - name: page_url
        description: "Page URL to load"
        required: true
        multiline: false
        example: "https://example.com"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: lookup_ip
    description: "Geolocation, ASN and ownership for an IPv4/IPv6 address"
    parameters:
      - name: ip
        description: "IP address"
        required: true
        multiline: false
        example: "8.8.8.8"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: lookup_crypto
    description: "Sanctions, labels and risk score for a crypto address"
    parameters:
      - name: address
        description: "Wallet address"
        required: true
        multiline: false
        example: "bc1q..."
        schema:
          type: string
      - name: chain
        description: "Chain (blank = auto-detect)"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
        options:
          - ""
          - "btc"
          - "eth"
          - "sol"
          - "trx"
          - "bsc"
          - "polygon"
          - "arbitrum"
          - "optimism"
          - "base"
          - "avax"
          - "doge"
          - "ton"
    returns:
      schema:
        type: string
  - name: bulk_lookup_crypto
    description: "Look up many crypto addresses (batches of 100)"
    parameters:
      - name: addresses
        description: "Addresses separated by commas, spaces or new lines"
        required: true
        multiline: true
        example: ""
        schema:
          type: string
      - name: chain
        description: "Chain applied to the whole batch (blank = auto-detect)"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
        options:
          - ""
          - "btc"
          - "eth"
          - "sol"
          - "trx"
          - "bsc"
          - "polygon"
          - "arbitrum"
          - "optimism"
          - "base"
          - "avax"
          - "doge"
          - "ton"
    returns:
      schema:
        type: string
  - name: lookup_hash
    description: "Known-good / known-malicious verdict for an MD5, SHA-1, SHA-256 or SHA-512"
    parameters:
      - name: hash
        description: "Hex digest"
        required: true
        multiline: false
        example: "44d88612fea8a8f36de82e1278abb02f"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: bulk_lookup_hash
    description: "Look up many hashes (batches of 500)"
    parameters:
      - name: hashes
        description: "Hashes separated by commas, spaces or new lines"
        required: true
        multiline: true
        example: ""
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: upload_file
    description: "Upload a Shuffle file (max 10 MB) for analysis; returns its sha256"
    parameters:
      - name: file_id
        description: "Shuffle file ID"
        required: true
        multiline: false
        example: "$exec.file_id"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_file_results
    description: "Analysis results for an uploaded file"
    parameters:
      - name: sha256
        description: "SHA-256 returned by upload_file"
        required: true
        multiline: false
        example: ""
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_file_tool_output
    description: "Raw output of one tool listed in the file results"
    parameters:
      - name: sha256
        description: "SHA-256 of the file"
        required: true
        multiline: false
        example: ""
        schema:
          type: string
      - name: tool
        description: "Tool name as listed in the results"
        required: true
        multiline: false
        example: "yara"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: analyze_url
    description: "Phishing shapes, embedded redirects and what mlab knows about the host"
    parameters:
      - name: target_url
        description: "URL to analyze"
        required: true
        multiline: false
        example: "https://bit.ly/3xYz"
        schema:
          type: string
      - name: resolve
        description: "Follow redirects / unmask short links"
        required: false
        multiline: false
        example: "false"
        schema:
          type: string
        options:
          - "false"
          - "true"
    returns:
      schema:
        type: string
  - name: analyze_email
    description: "Mailbox type, spoofability of the domain and risk score"
    parameters:
      - name: email
        description: "Email address"
        required: true
        multiline: false
        example: "name@email.com"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: analyze_phone
    description: "Validity, line type, operator and scam shapes"
    parameters:
      - name: number
        description: "Phone number in E.164 form"
        required: true
        multiline: false
        example: "+33612345678"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: lookup_mac
    description: "Vendor, randomization, virtualization and every notation"
    parameters:
      - name: mac
        description: "MAC address"
        required: true
        multiline: false
        example: "00:1A:2B:3C:4D:5E"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: extract_iocs
    description: "Pull every indicator out of raw text, with optional SMS threat scoring"
    parameters:
      - name: text
        description: "Raw text (report, log, email, SMS), up to 1 MB"
        required: true
        multiline: true
        example: ""
        schema:
          type: string
      - name: risk
        description: "SMS threat scoring (blank = off, fast = offline, deep = network checks)"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
        options:
          - ""
          - "fast"
          - "deep"
      - name: country
        description: "Keyword and brand pack used by the scorer"
        required: false
        multiline: false
        example: "fr"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_quota
    description: "Remaining daily quota for a scan type"
    parameters:
      - name: scan_type
        description: "Scan type"
        required: true
        multiline: false
        example: "domain"
        schema:
          type: string
        options:
          - "domain"
          - "ip"
          - "file"
          - "crypto"
    returns:
      schema:
        type: string
  - name: search_cves
    description: "Search CVEs by keyword, vendor or product (public, no key used)"
    parameters:
      - name: query
        description: "Search query"
        required: true
        multiline: false
        example: "log4j"
        schema:
          type: string
      - name: severity
        description: "Severity filter"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
        options:
          - ""
          - "CRITICAL"
          - "HIGH"
          - "MEDIUM"
          - "LOW"
      - name: published_after
        description: "Only CVEs published on/after (YYYY-MM-DD)"
        required: false
        multiline: false
        example: "2024-01-01"
        schema:
          type: string
      - name: exact
        description: "Exact match"
        required: false
        multiline: false
        example: "false"
        schema:
          type: string
        options:
          - "false"
          - "true"
      - name: kev_only
        description: "Only CISA Known Exploited Vulnerabilities"
        required: false
        multiline: false
        example: "false"
        schema:
          type: string
        options:
          - "false"
          - "true"
    returns:
      schema:
        type: string
  - name: get_cve
    description: "Full CVE detail including EPSS and KEV (public)"
    parameters:
      - name: cve_id
        description: "CVE ID"
        required: true
        multiline: false
        example: "CVE-2021-44228"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_latest_cves
    description: "Vulnerabilities from the last 7 days (public)"
    returns:
      schema:
        type: string
  - name: list_threat_actors
    description: "List / search threat actors (public)"
    parameters:
      - name: origin
        description: "Country of origin"
        required: false
        multiline: false
        example: "Russia"
        schema:
          type: string
      - name: motivation
        description: "Motivation"
        required: false
        multiline: false
        example: "Espionage"
        schema:
          type: string
      - name: sector
        description: "Targeted sector"
        required: false
        multiline: false
        example: "Government"
        schema:
          type: string
      - name: limit
        description: "Max results"
        required: false
        multiline: false
        example: "50"
        schema:
          type: string
      - name: offset
        description: "Results to skip"
        required: false
        multiline: false
        example: "0"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_threat_actor
    description: "A threat actor by slug, with aliases, tools, CVEs and techniques (public)"
    parameters:
      - name: slug
        description: "Actor slug"
        required: true
        multiline: false
        example: "apt28"
        schema:
          type: string
    returns:
      schema:
        type: string
  - name: get_actors_by_cve
    description: "Threat actors known to exploit a CVE (public)"
    parameters:
      - name: cve_id
        description: "CVE ID"
        required: true
        multiline: false
        example: "CVE-2021-44228"
        schema:
          type: string
    returns:
      schema:
        type: string
large_image: data:image/png;base64,
